server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik faz TLS e o redirect non-www -> www; aqui é só HTTP interno.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # HTML sempre revalidado — i18n.js e conteúdo mudam a cada deploy.
    location = /index.html      { add_header Cache-Control "no-cache"; }
    location = /conjugador.html { add_header Cache-Control "no-cache"; }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2?|aiff|m4a|mp3)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Permite /conjugador além de /conjugador.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
